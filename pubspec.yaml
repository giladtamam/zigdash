name: zigdash
description: "Material 3 MQTT dashboard for Zigbee2MQTT control."
publish_to: 'none'
version: 1.10.0+24

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  # drift 2.32+ needs sqlite3 3.x (native build hooks) and drift_flutter 0.3;
  # that move is its own change. 2.31 is the newest on sqlite3 2.x and its
  # generator understands Flutter 3.47's Dart.
  drift: '>=2.31.0 <2.32.0'
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # MQTT
  mqtt_client: ^10.5.1
  meta: ^1.16.0

  # Reactive
  rxdart: ^0.28.0

  # Routing
  go_router: ^14.6.0

  # Material You system colors (Android 12+)
  dynamic_color: ^1.9.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Preferences
  shared_preferences: ^2.3.2

  # Encrypted password storage
  flutter_secure_storage: ^9.2.4

  # IDs
  uuid: ^4.5.1
  flutter_markdown: ^0.7.7+1

  # App version display (Settings → About)
  package_info_plus: ^8.1.0
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1

  # Codegen
  build_runner: ^2.5.0
  drift_dev: '>=2.31.0 <2.32.0'
  alchemist: ^0.14.0
  typed_data: ^1.3.0
  image: ^4.8.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - docs/USER_GUIDE.md

# Launcher icon generation: `dart run flutter_launcher_icons`.
# Source PNGs are produced by `dart run tool/gen_icon.dart`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3B82F6"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#3B82F6"
    theme_color: "#3B82F6"

# Native splash: `dart run flutter_native_splash:create`.
# Brand background with the dashboard-tiles logo centered (light + dark same).
flutter_native_splash:
  color: "#3B82F6"
  color_dark: "#3B82F6"
  image: assets/icon/foreground.png
  android_12:
    color: "#3B82F6"
    color_dark: "#3B82F6"
    image: assets/icon/foreground.png
  web: false
