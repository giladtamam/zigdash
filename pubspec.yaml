name: zigdash
description: "Material 3 MQTT dashboard for Zigbee2MQTT control."
publish_to: 'none'
version: 2.2.0+35

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  # drift 2.32+ needs sqlite3 3.x (native build hooks) and drift_flutter 0.3;
  # that move is its own change. 2.31 is the newest on sqlite3 2.x and its
  # generator understands Flutter 3.47's Dart.
  drift: '>=2.31.0 <2.32.0'
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # MQTT
  mqtt_client: ^10.5.1
  meta: ^1.16.0

  # Reactive
  rxdart: ^0.28.0

  # Routing
  go_router: ^14.6.0

  # Material You system colors (Android 12+)
  dynamic_color: ^1.9.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Preferences
  shared_preferences: ^2.3.2

  # Encrypted password storage
  flutter_secure_storage: ^9.2.4

  # IDs
  uuid: ^4.5.1
  flutter_markdown: ^0.7.7+1

  # App version display (Settings → About)
  package_info_plus: ^8.1.0
  # Phone model and Android version for Support details.
  device_info_plus: ^12.4.0
  in_app_review: ^2.0.12
  # Setup guides open in the browser.
  url_launcher: ^6.3.0
  wakelock_plus: ^1.3.3
  aptabase_flutter: ^0.5.0
  file_picker: ^11.0.3
  # Alerts arrive through Google's push with ZigDash as its own UnifiedPush
  # distributor (docs/design/alerts-2.3.md). The Android pieces only: the
  # cross-platform wrapper drags in a Linux native build (webcrypto/CMake).
  unifiedpush_android: ^3.5.0
  unifiedpush_platform_interface: ^4.0.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1

  # Codegen
  build_runner: ^2.5.0
  drift_dev: '>=2.31.0 <2.32.0'
  alchemist: ^0.14.0
  typed_data: ^1.3.0
  image: ^4.8.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - docs/USER_GUIDE.md
    - node-red/alerts-flow.json
    - assets/fonts/licenses/
  # Signal type (docs/design/signal-2.0.md §2): bundled subsets, cut by
  # tool/fonts/build_fonts.py. Never fetched at runtime.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansHebrew
      fonts:
        - asset: assets/fonts/IBMPlexSansHebrew-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansHebrew-SemiBold.ttf
          weight: 600
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded-subset.ttf

# Launcher icon: the Signal tile grid (docs/design/signal-2.0.md §9).
# tool/icons/render_signal_icon.sh renders tool/icons/signal/*.svg to
# assets/icon/*.png and runs flutter_launcher_icons.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F6F3EC"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#F6F3EC"
    theme_color: "#F6F3EC"

# Native splash: `dart run flutter_native_splash:create`.
# Signal ground (ivory; near-black in dark) with the tile-grid logo centered.
flutter_native_splash:
  color: "#F6F3EC"
  color_dark: "#15130F"
  image: assets/icon/foreground.png
  android_12:
    color: "#F6F3EC"
    color_dark: "#15130F"
    image: assets/icon/foreground.png
  web: false
